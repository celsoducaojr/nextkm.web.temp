<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" width="160" height="40">
  <defs>
    <linearGradient id="lg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DE146C" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DE146C" />
      <stop offset="60%" stop-color="#8B5CF6" />
    </linearGradient>
  </defs>
  <rect width="40" height="40" rx="10" fill="url(#lg)" />
  <!-- Stylised "N" letterform -->
  <polyline
    points="10,30 10,10 22,28 22,10"
    fill="none"
    stroke="white"
    stroke-width="3.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- KM accent dot -->
  <circle cx="30" cy="20" r="3" fill="white" opacity="0.9" />
  <!-- NextKM text -->
  <text x="48" y="27" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="18" font-weight="800" letter-spacing="-0.5">
    <tspan fill="url(#textGradient)">Next</tspan><tspan fill="#1f2937">KM</tspan>
  </text>
</svg>
